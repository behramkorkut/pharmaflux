# Candidat 2 du modèle d'embeddings (mission 07, addendum 1 C1) : potion-multilingual-128M,
# un modèle statique Model2Vec (une table de vecteurs par jeton, sans transformeur), 256
# dimensions, MIT. Beaucoup plus rapide qu'e5-small, qualité à mesurer.
#
# La révision et les empreintes sont relevées par beko (seul à télécharger) :
#   uv run pharmaflux index modele relever potion-multilingual-128m
# puis recopiées ici telles que la commande les affiche. Avant cela, `installer` refuse.

nom = "potion-multilingual-128m"
depot = "minishlab/potion-multilingual-128M"
licence = "MIT"

[[fichiers]]
chemin = "model.safetensors"

[[fichiers]]
chemin = "tokenizer.json"

[[fichiers]]
chemin = "config.json"
