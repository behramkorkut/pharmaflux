# Jeu de questions de référence v2 — Pharmaflux, mission 09 (PRD annexe B).
#
# La v2 est un nouveau fichier : la v0 et la v1 restent rejouables telles quelles. Elle se note
# à l'INSTANT DE L'INDEX du jeu de démo (2026-10-27T00:17:12Z), comme la v1, et ses indicateurs
# se rendent en trois blocs : la v1 telle quelle, les questions nouvelles seules, la v2 entière
# (addendum 1 de la mission 09).
#
# 1. LES 88 QUESTIONS DE LA V1, reprises sous leurs identifiants et au même texte (addendum 1
#    H1). Trois comportements attendus changent, et seulement eux :
#    - disponibilite-005 : d'abstention à réponse AVEC RÉSERVE, comme avis_has-005 depuis la v1
#      (le signalement existe, le référentiel ne connaît pas le CIS) ;
#    - avis_has-004 et avis_has-009 : d'abstention à réponse notée par le LIEN RENDU (le code rend
#      la page de l'avis sous la réponse ; le LLM n'écrit toujours aucune adresse).
#    historique-003, -008 et remboursement-010 restent des abstentions.
#
# 2. LES QUESTIONS NEUVES QUI MESURENT LES CORRECTIFS DE LA MISSION 08 (18), écrites et figées
#    dans ce commit, AVANT tout commit de retouche de l'assistant (addendum 1 G, H) ; la table
#    des sections et la liste des mots courants étaient déjà dans le code (commit 07ac561). Ce qui
#    garantit qu'elles n'ont pas servi à mettre la retouche au point :
#    - dix sont TIRÉES PAR UNE RÈGLE ÉCRITE D'ABORD, appliquée sans LLM par
#      evaluation/choisir_neuves_v2.py (sa docstring dit la règle) et recopiées telles quelles :
#      sur les CIS que la v1 ne vise pas, rangés par sha256 de « <groupe>/<CIS> » ;
#      * le rappel (avis_has-012 à -015) : les quatre premiers CIS dont aucun fragment « avis »
#        n'est dans les dix de la recherche hybride (675 CIS examinés, 4 retenus), le constat
#        d'avis_has-003 (OZEMPIC), fait par la recherche seule sur l'index du jeu au format 3 ;
#      * les dates de l'avis (avis_has-016 à -018) : le plus ancien dossier SMR à une ligne d'un
#        CIS qui en a au moins deux, la forme d'avis_has-007 et -011 (la date est due avec le
#        niveau, annexe B) ;
#      * les dates de mise à jour (disponibilite-013 à -015) : un CIS à une seule ligne de
#        disponibilité, avec sa date de mise à jour, la forme de disponibilite-012 et
#        historique-005 (statut, début et mise à jour sont dus) ;
#    - trois PIÈGES DE MOTS COURANTS (hors_perimetre-012 à -014) : « eau », « fer », « gel » dans
#      une question qui ne nomme aucun médicament ;
#    - cinq QUESTIONS MÉDICALES (medical-012 à -016) qui reprennent les mots d'un avis, dont la
#      durée de traitement « selon l'avis » (G2 : dose, durée, rythme et mode de prise donnent un
#      refus), avec les tournures que les règles ne connaissent pas encore (« mon bébé », « ma
#      mère », « mon enfant »).
#    Aucune n'a été posée au LLM : aucun appel ne part d'une session d'agent, et la démonstration
#    de beko viendra après les retouches.
#
# 3. AU PALIER 3, sous de nouveaux identifiants, sans toucher aux dix-huit :
#    - avis_has-019 à -023 : la table des sections (controle-palier-2.md, question 1), tirées par
#      evaluation/choisir_neuves_v2_table.py et figées avant le changement de la table ;
#    - avis_has-024 à -042 : le texte des avis, tirées par evaluation/choisir_texte_v2.py sur les
#      pages du jeu (nature 4, date 4, « L'essentiel » 4, « Quel progrès ? » 4, lien 3) ; leur
#      attendu « attendu_has » se vérifie sans gold, depuis l'archive HAS et le bronze des liens ;
#    - avis_has-043 à -046 : les pièges (une décision plus récente que la date de la BDPM, un
#      dossier sans page, un avis hors du corpus, la page rejetée de PEDMARQSI) ;
#    - avis_has-047 à -049 : ce que seul le PDF de l'avis dit (abstention motivée, ADR 0013) ;
#    - avis_has-050 : la comparaison de deux médicaments (G3).
#    Les trois questions médicales qui ont fait étendre la règle de refus (medical-013, -014,
#    -016) ont servi à la trouver : elles ne la mesurent pas (controle-palier-2.md).
#
# `uv run pharmaflux questions verifier --questions evaluation/questions-reference-v2.toml
#  --racine demo/archive --entrepot data/demo/lakehouse` recalcule chaque attendu depuis
# l'archive (sha256 + contrat) et depuis le gold, et exige la concordance.

