# CI de Pharmaflux : deux jobs. « verifier » rejoue les vérifications locales
# plus les tests des garde-fous du circuit ; « integration » démarre le Redpanda
# du dépôt (le même fichier compose que sur le Mac, ADR 0007) et lance les
# tests marqués. Aucun appel réseau vers les sources de données (les tests
# travaillent sur des fixtures).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer uv (avec cache)
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Installer les dépendances (verrouillées)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q

      - name: Crochets git
        run: sh infra/git-hooks/test-crochets.sh

      - name: Garde-fou Claude Code
        run: python3 infra/agents/test_garde_fou.py

      - name: Scripts de planification (shellcheck)
        run: |
          if ls infra/planification/*.sh >/dev/null 2>&1; then
            # même version qu'en local (uv est installé plus haut) : un shellcheck
            # différent signale d'autres avertissements, comme SC2015 sur la PR 1
            uvx --from shellcheck-py==0.11.0.1 shellcheck infra/planification/*.sh
          else
            echo "aucun script dans infra/planification/ : rien à vérifier"
          fi

  integration:
    # Le bus réel (mission 03) : le fichier compose du dépôt, pas un « services: »
    # d'Actions, pour une seule configuration entre le Mac et la CI. Deux écarts
    # possibles, nommés dans le rapport du palier 3 : l'architecture (amd64 ici,
    # arm64 sur le Mac ; les images sont multi-architecture) et la version de
    # Compose (le bloc « configs: content: » demande au moins la 2.23.1).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer uv (avec cache)
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Installer les dépendances (verrouillées)
        run: uv sync --frozen

      - name: Versions de Docker et de Compose (les écarts possibles avec le Mac)
        run: |
          docker version --format '{{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}'
          docker compose version

      - name: Démarrer Redpanda et Qdrant (compose du dépôt, images épinglées)
        run: docker compose -p pharmaflux up -d --wait

      - name: La grappe est amorcée comme sur le Mac (création automatique coupée)
        run: |
          valeur=$(docker compose -p pharmaflux exec -T redpanda rpk cluster config get auto_create_topics_enabled)
          echo "auto_create_topics_enabled=$valeur"
          test "$valeur" = "false"

      - name: Schémas (historique puis courant, sur un registre neuf)
        run: uv run pharmaflux schemas enregistrer

      # Mission 07 (A) : le registre coupait parfois un POST …/versions sans réponse ni ligne
      # au journal. Ses loggers passent en debug jusqu'à l'arrêt du courtier, par l'API
      # d'administration (le compose du Mac ne change pas), pour que la prochaine coupure soit
      # écrite. Le client réessaie (deux fois, horodaté) ; un réessai pendant les tests fait
      # échouer la session, sauf dans le test de reproduction, qui en affiche le nombre.
      - name: Journal du registre en debug (diagnostic d'une coupure)
        run: >-
          docker compose -p pharmaflux exec -T redpanda
          rpk cluster loggers set schemaregistry pandaproxy pandaproxy/requests kafka/client httpd
          --node-id 0 --level debug --expiry-seconds 0 -X admin.hosts=localhost:9644

      - name: Tests d'intégration (ici, un saut est un échec, la variable l'exige)
        run: uv run pytest -q -rE -m integration
        env:
          PHARMAFLUX_INTEGRATION_EXIGEE: "1"

      # Le même Makefile que sur le Mac (mission 04). Le bus est neuf au sens du rejeu : les
      # tests d'intégration effacent leurs topics et sujets. L'étape finit par verifier-bus
      # --racine demo/archive : la démo est vérifiée par la référence indépendante des fichiers.
      - name: Démo sans pause (make demo, bus neuf)
        run: make demo DEMO_OPTIONS=--sans-pause

      # Le silver du jeu depuis le bus que la démo vient de remplir (mission 05, ADR 0009) : une
      # table Iceberg par entité sous data/demo/lakehouse, puis la vérification contre l'archive,
      # qui a le dernier mot (code 2 à la moindre différence).
      - name: Silver du jeu depuis le bus, puis vérification contre l'archive (make silver)
        run: make silver

      # Le gold du jeu, calculé depuis ce silver (mission 06, ADR 0010) : les quatorze contrôles
      # de qualité (code 2 si un bloquant tombe), puis les 25 questions recalculées depuis le
      # gold, qui doivent concorder avec le calcul depuis le bronze (code 2 sinon).
      - name: Gold du jeu, contrôles de qualité et questions (make gold)
        run: make gold

      # L'index du jeu (mission 07, ADR 0011), avec l'encodeur de test : toute la chaîne, sans
      # modèle à télécharger. Le premier make index construit (aucun index), le second met à
      # jour (rien à faire) ; chacun finit par index verifier, qui a le dernier mot.
      - name: Index du jeu, encodeur de test (make index, deux fois)
        run: |
          make index INDEX_MODELE=test
          make index INDEX_MODELE=test

      # Le vrai modèle, en cache d'un run à l'autre : la clé est l'empreinte de son TOML (révision
      # et sha256 de chaque fichier), donc un épinglage qui change invalide le cache.
      - name: Cache du modèle épinglé
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/pharmaflux-modeles
          key: modele-${{ hashFiles('src/pharmaflux/index/modeles/e5-small-int8.toml') }}

      # Ce que le cache n'a pas (ou a d'altéré) est téléchargé à la révision du TOML, chaque fichier
      # vérifié par son sha256 avant d'être mis en place ; puis tout est revérifié, sans réseau.
      - name: Modèle épinglé (e5-small-int8, sha256 vérifiés)
        run: |
          uv run pharmaflux index modele installer e5-small-int8
          uv run pharmaflux index modele verifier e5-small-int8

      # Ses tests (les jetons égaux à tokenizer.json, les vecteurs), puis un index réduit aux
      # CIS du jeu de questions v0, vérifié, et trois recherches réelles : le modèle se charge
      # et trouve.
      - name: Le vrai modèle sur un sous-ensemble (tests « modele », index réduit, recherches)
        env:
          PHARMAFLUX_MODELE_EXIGE: "1"
        run: |
          uv run pytest -q -rE -rs -m modele
          uv run pharmaflux index construire --entrepot data/demo/lakehouse \
            --cis 60007960 --cis 60016589 --cis 60143654 --cis 60234100 --cis 60921824 \
            --cis 62011103 --cis 63210923 --cis 63930084 --cis 65143010 --cis 65999556 \
            --cis 66890524 --cis 67026956 --cis 67851912 --cis 68081368 --cis 68486929 \
            --cis 68705771
          uv run pharmaflux index verifier --entrepot data/demo/lakehouse
          uv run pharmaflux index chercher "LARIAM 250 mg est-il en rupture de stock ?" -k 3
          uv run pharmaflux index chercher "Quel est le taux de remboursement de LEVOCARNIL ?" -k 3
          uv run pharmaflux index chercher "MICROVAL est-il en tension d'approvisionnement ?" -k 3

      # Tout le journal (--tail=100 n'avait gardé que 4 s au run de main sur 98505d3), la santé
      # de la grappe et la mémoire du conteneur, en artefact plutôt que dans le journal du job.
      - name: Diagnostic du courtier en cas d'échec
        if: failure()
        run: |
          mkdir -p diagnostic
          docker compose -p pharmaflux logs --timestamps redpanda > diagnostic/courtier.log 2>&1 || true
          docker compose -p pharmaflux exec -T redpanda rpk cluster health > diagnostic/sante.txt 2>&1 || true
          docker stats --no-stream pharmaflux-redpanda > diagnostic/stats.txt 2>&1 || true
          tail -n 40 diagnostic/courtier.log

      - name: Déposer le diagnostic
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostic-courtier
          path: diagnostic/
          retention-days: 14

      - name: Arrêter Redpanda et Qdrant (volumes effacés)
        if: always()
        run: docker compose -p pharmaflux down -v
