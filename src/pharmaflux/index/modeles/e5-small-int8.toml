# Candidat 1 du modèle d'embeddings (mission 07, addendum 1 C1) : multilingual-e5-small,
# quantifié int8 au format ONNX. 118 M de paramètres, vecteurs de 384 dimensions, fenêtre de
# 512 jetons ; préfixes « passage: » et « query: ». Le modèle d'origine est
# intfloat/multilingual-e5-small (MIT) ; l'export ONNX quantifié vient du dépôt Xenova, qui
# garde sa licence.
#
# La révision et les empreintes ont été relevées par beko le 29/10/2026 (seul à télécharger) :
#   uv run pharmaflux index modele relever e5-small-int8
# puis recopiées ici telles que la commande les a affichées.

nom = "e5-small-int8"
depot = "Xenova/multilingual-e5-small"
licence = "MIT"
revision = "761b726dd34fb83930e26aab4e9ac3899aa1fa78"
date_revision = 2025-07-22

[[fichiers]]
chemin = "onnx/model_quantized.onnx"
sha256 = "f80102d3f2a1229f387d3c81909990d8945513e347b0eab049f7de3c6f98c193"

[[fichiers]]
