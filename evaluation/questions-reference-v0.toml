# Jeu de questions de référence v0 — Pharmaflux, mission 01 (PRD annexe B).
#
# Quarante questions, cinq par catégorie. Chaque réponse attendue est lue
# dans une archive précise du 24/10/2026 (chemin et sha256), par la clé et
# les colonnes du contrat de schéma : `uv run pharmaflux questions verifier`
# la recalcule et signale tout écart. Les valeurs sont celles du fichier,
# telles quelles (« 65% », « 30 % », « 1,16 »), jamais corrigées.
# Les médicaments sont réels et pris dans l'archive ; aucune question ne
# vise un patient. Les questions Dépense attendent Open Medic (Lot 4).
# Format : voir evaluation/README.md.

version = "v0"
description = "Quarante questions, cinq par catégorie de l'annexe B du PRD, sur l'archive BDPM du 24/10/2026."

