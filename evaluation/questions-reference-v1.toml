# Jeu de questions de référence v1 — Pharmaflux, mission 08 (PRD annexe B).
#
# Quatre-vingt-huit questions, au moins dix par catégorie de l'annexe B. La v1
# sert à NOTER l'assistant gouverné : bonne réponse, citation juste, abstention
# ou refus quand il le faut (PRD §2.2). Elle reprend la v0 (qui reste rejouable
# telle quelle), la prolonge, et date ses attendus à l'INSTANT DE L'INDEX du
# jeu de démo (2026-10-27T00:17:12Z), auquel l'assistant répond :
#   - les fichiers à une seule archive (disponibilité, spécialités, génériques,
#     SMR, ASMR, liens CT) n'ont pas changé dans la fenêtre : l'archive du
#     24/10 porte l'état de l'instant de l'index ;
#   - les présentations (CIS_CIP_bdpm.txt) ont changé ; les questions citent
#     donc l'archive du 27/10 (l'instant de l'index).
#
# `uv run pharmaflux questions verifier --questions evaluation/questions-reference-v1.toml
#  --racine demo/archive --entrepot data/demo/lakehouse` recalcule chaque
# attendu depuis l'archive (sha256 + contrat) ET depuis le gold, et exige la
# concordance. Les valeurs sont celles du fichier, telles quelles. Les
# médicaments sont réels et pris dans l'archive ; aucune question ne vise un
# patient. Format et champs de notation : evaluation/README.md et
# src/pharmaflux/evaluation/questions.py.
#
# Changements depuis la v0 : `alternatives-004` retirée, remplacée par
# `alternatives-006` (princeps d'un groupe) ; `avis_has-005` passe d'abstention
# à réponse avec réserve. Au palier 3 de la mission 08, avant toute évaluation
# réelle, cinq questions dont la valeur n'est pas dans le texte des fragments
# passent en abstention (historique-003, -008, avis_has-004, -009,
# remboursement-010) : l'assistant ne lit que l'index (49 réponses, 28
# abstentions, 11 refus). Pièges : nom proche (disponibilite-009), CIS hors
# référentiel (disponibilite-005), médicale déguisée en disponibilité
# (medical-006), deux médicaments (disponibilite-010). Cas limites sans refus :
# disponibilité « pour mon traitement » (disponibilite-011, le fait sans
# conseil), effets indésirables (hors_perimetre-006, abstention hors périmètre).

version = "v1"
description = "Quatre-vingt-huit questions, au moins dix par catégorie de l'annexe B, à l'instant de l'index du jeu de démo (2026-10-27T00:17:12Z)."
instant = "2026-10-27T00:17:12Z"

