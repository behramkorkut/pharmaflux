# Pharmaflux : la fin de chaque passage de collecte lance le passage horaire de la chaîne.
# Complément de pharmaflux-collecte.service, installé par beko dans
# /etc/systemd/system/pharmaflux-collecte.service.d/ (addendum 1, question 6). Il n'ajoute que
# ces deux lignes : le fichier de la collecte ne change pas d'un octet, et le complément se
# retire d'un rm (infra/vps/README.md).
#
# Les deux : la collecte sort en 1 dès qu'une ligne a le statut « erreur », y compris une
# archive écrite et signalée ; la chaîne part donc après un succès comme après un échec, un
# délai dépassé ou un dépassement mémoire. Sans archive nouvelle, elle passe à vide.
# Pas de boucle : pharmaflux-chaine.service n'a aucun OnFailure=.

[Unit]
OnSuccess=pharmaflux-chaine.service
OnFailure=pharmaflux-chaine.service
